<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký</title>
    <link rel="stylesheet" href="css/register.css">
</head>
<body>

<div class="register">
    <h2>Đăng Ký</h2>

    <form action="#">

        <div class="form-group">
            <label for="name">Họ và tên</label>
            <input type="text" id="name" placeholder="Nhập họ và tên">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Nhập email">
        </div>

        <div class="form-group">
            <label for="phone">Số điện thoại</label>
            <input type="tel" id="phone" placeholder="Nhập số điện thoại">
        </div>

        <div class="form-group">
            <label for="birthday">Ngày sinh</label>
            <input type="date" id="birthday">
        </div>

        <div class="form-group">
            <label>Giới tính:</label>
            <input type="radio" name="gender" id="male">
            <label for="male">Nam</label>

            <input type="radio" name="gender" id="female">
            <label for="female">Nữ</label>
        </div>

        <div class="form-group">
            <label for="course">Chọn khóa học</label>
            <select id="course">
                <option>HTML & CSS</option>
                <option>JavaScript</option>
                <option>PHP</option>
                <option>ReactJS</option>
            </select>
        </div>

        <div class="form-group">
            <label for="note">Ghi chú</label>
            <textarea id="note" rows="4" placeholder="Nhập ghi chú"></textarea>
        </div>

        <div class="form-group">
            <input type="checkbox" id="agree">
            <label for="agree">Đồng ý điều khoản</label>
        </div>

        <button type="submit">Đăng Ký</button>

    </form>
</div>

</body>
</html>
